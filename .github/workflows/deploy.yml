name: Deploy EduConnect production

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to release the current production branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: edu-connect-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production API
    if: github.event_name == 'push' || inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edu-connect-api.queevo.tech

    env:
      CPANEL_HOST: 31.22.4.112
      CPANEL_PORT: 1394
      CPANEL_USER: queevote
      BACKEND_DIR: /home/queevote/edu-connect-api.queevo.tech
      PHP_BIN: /opt/alt/php82/usr/bin/php

    steps:
      - name: Checkout production release
        uses: actions/checkout@v4

      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version
          php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'

      - name: Install backend dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
          COMPOSER_MAX_PARALLEL_HTTP: 2
        run: |
          composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              status=$?
              echo "Attempt $attempt failed with exit code $status. Retrying..."
              sleep $((attempt * 30))
            done
            return $status
          }

          retry composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress \
            || retry composer install --no-dev --no-interaction --prefer-source --optimize-autoloader --no-progress

      - name: Configure production SSH
        env:
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          if [ -z "$CPANEL_SSH_KEY_B64" ]; then
            echo "CPANEL_SSH_KEY_B64 is empty or missing."
            exit 1
          fi
          printf '%s' "$CPANEL_SSH_KEY_B64" | tr -d '\r\n ' | base64 -d > "$HOME/.ssh/cpanel_key"
          chmod 600 "$HOME/.ssh/cpanel_key"
          ssh-keygen -y -f "$HOME/.ssh/cpanel_key" > "$HOME/.ssh/cpanel_key.pub"
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> "$HOME/.ssh/known_hosts"
          echo "SSH_TARGET=$CPANEL_USER@$CPANEL_HOST" >> "$GITHUB_ENV"
          echo "SSH_OPTS=-F /dev/null -i $HOME/.ssh/cpanel_key -p $CPANEL_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o PreferredAuthentications=publickey -o ConnectTimeout=30 -o ConnectionAttempts=5" >> "$GITHUB_ENV"

      - name: Prepare remote folders
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              status=$?
              echo "Attempt $attempt failed with exit code $status. Retrying..."
              sleep $((attempt * 15))
            done
            return $status
          }

          retry ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p '$BACKEND_DIR' '$BACKEND_DIR/bootstrap/cache' '$BACKEND_DIR/storage/app/private' '$BACKEND_DIR/storage/app/public' '$BACKEND_DIR/storage/framework/cache/data' '$BACKEND_DIR/storage/framework/sessions' '$BACKEND_DIR/storage/framework/testing' '$BACKEND_DIR/storage/framework/views' '$BACKEND_DIR/storage/logs'"

      - name: Deploy backend runtime
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              status=$?
              echo "Attempt $attempt failed with exit code $status. Retrying..."
              sleep $((attempt * 15))
            done
            return $status
          }

          retry rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.user.ini' \
            --exclude='php.ini' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='deploy/' \
            --exclude='deployment/' \
            --exclude='docs/' \
            --exclude='frontend/' \
            --exclude='node_modules/' \
            --exclude='public/build/' \
            --exclude='public/storage/' \
            --exclude='storage/' \
            --exclude='tests/' \
            --exclude='tmp/' \
            --exclude='*.md' \
            --exclude='*.zip' \
            -e "ssh $SSH_OPTS" ./ "$SSH_TARGET:$BACKEND_DIR/"

      - name: Install cPanel backend entry files
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              status=$?
              echo "Attempt $attempt failed with exit code $status. Retrying..."
              sleep $((attempt * 15))
            done
            return $status
          }

          retry rsync -az -e "ssh $SSH_OPTS" deployment/cpanel/backend-direct-index.php "$SSH_TARGET:$BACKEND_DIR/index.php"
          retry rsync -az -e "ssh $SSH_OPTS" deployment/cpanel/backend-direct.htaccess "$SSH_TARGET:$BACKEND_DIR/.htaccess"

      - name: Finalize Laravel
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              status=$?
              echo "Attempt $attempt failed with exit code $status. Retrying..."
              sleep $((attempt * 15))
            done
            return $status
          }

          retry ssh $SSH_OPTS "$SSH_TARGET" "cd '$BACKEND_DIR' && test -s .env && chmod -R u+rwX bootstrap/cache storage && CACHE_STORE=file '$PHP_BIN' artisan optimize:clear && '$PHP_BIN' artisan migrate --force && '$PHP_BIN' artisan optimize && '$PHP_BIN' artisan educonnect:realtime-check && '$PHP_BIN' artisan educonnect:push-check"
