name: Gate production candidate checks
on:
  pull_request:
    branches: [production]
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      HIKVISION_PUSH_ENABLED: 'false'
      GATE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, openssl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env.testing
      - run: vendor/bin/pest --configuration=phpunit.gate-release.xml --compact --fail-on-warning --fail-on-empty-test-suite
